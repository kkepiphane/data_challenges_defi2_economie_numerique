[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "light"
primaryColor = "#1E6B4F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EAF3EE"
textColor = "#141414"
borderColor = "#CBDDD2"
dataframeBorderColor = "#D6E5DC"
dataframeHeaderBackgroundColor = "#EAF3EE"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap, 'Segoe UI', sans-serif"
headingFont = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap, 'Segoe UI', sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.3rem"
buttonRadius = "0.3rem"
showWidgetBorder = true
showSidebarBorder = true
greenColor = "#237B52"
yellowColor = "#B5862A"
redColor = "#B3312C"
blueColor = "#4868B0"
chartCategoricalColors = ["#237B52", "#B5862A", "#4868B0"]

[theme.sidebar]
backgroundColor = "#F1F7F3"
secondaryBackgroundColor = "#E1EEE6"
textColor = "#14261D"
primaryColor = "#1E6B4F"
borderColor = "#C6DACE"
