[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "light"
primaryColor = "#141414"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F1"
textColor = "#141414"
borderColor = "#E4E4E0"
dataframeBorderColor = "#E4E4E0"
dataframeHeaderBackgroundColor = "#F6F6F4"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap, 'Segoe UI', sans-serif"
headingFont = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap, 'Segoe UI', sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.3rem"
buttonRadius = "0.3rem"
showWidgetBorder = true
showSidebarBorder = true
greenColor = "#237B52"
yellowColor = "#B5862A"
redColor = "#B3312C"
blueColor = "#4868B0"
chartCategoricalColors = ["#237B52", "#B5862A", "#4868B0"]

[theme.sidebar]
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#141414"
primaryColor = "#141414"
borderColor = "#E4E4E0"
